<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Leads | NorthX Systems</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="dashboard-body" data-section="leads">

  <aside class="sidebar"></aside>

  <main class="dashboard-main">
    <header class="dashboard-topbar page-header">
      <div>
        <p class="eyebrow">Leads</p>
        <h1>Revenue Opportunities</h1>
        <p>Review every captured lead and keep follow-up moving.</p>
      </div>

      <div class="topbar-actions">
        <input id="lead-search" type="text" placeholder="Search leads..." />
        <button id="export-csv" class="nx-btn nx-btn-secondary" type="button">Export CSV</button>
      </div>
    </header>

    <section class="dashboard-panel">
      <div class="panel-header">
        <div>
          <h2>Lead Database</h2>
          <p>Search, filter, and open lead details without losing context.</p>
        </div>

        <select id="lead-filter" aria-label="Filter leads by status">
          <option>All Leads</option>
          <option>New</option>
          <option>Contacted</option>
          <option>Booked</option>
          <option>Lost</option>
        </select>
      </div>

      <div class="table-wrap nx-table-wrap">
        <table class="leads-table nx-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Call Status</th>
              <th>Time</th>
              <th>Follow-Up</th>
              <th>Notes</th>
            </tr>
          </thead>

          <tbody id="leads-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="lead-modal" id="lead-modal">
    <div class="lead-modal-card">
      <button class="modal-close" id="modal-close">×</button>

      <p class="eyebrow">Lead Details</p>
      <h2 id="modal-lead-name">Unknown Lead</h2>

      <div class="modal-grid">
        <div>
          <span>Phone</span>
          <strong id="modal-lead-phone">-</strong>
        </div>

        <div>
          <span>Call Status</span>
          <strong id="modal-lead-status">-</strong>
        </div>

        <div>
          <span>Follow-Up</span>
          <strong id="modal-lead-followup">-</strong>
        </div>

        <div>
          <span>Created</span>
          <strong id="modal-lead-created">-</strong>
        </div>
      </div>

      <label class="modal-label" for="modal-lead-notes">Notes</label>
      <textarea id="modal-lead-notes" class="nx-textarea"></textarea>

      <button class="modal-save nx-btn nx-btn-primary" id="modal-save-notes" type="button">Save Notes</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/northx-ui.js"></script>
  <script src="js/leads.js"></script>

</body>
</html>
