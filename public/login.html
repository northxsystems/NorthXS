<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Login | NorthX Systems</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="login-body">

  <header class="navbar">
    <div class="logo">NorthX<span>Systems</span></div>
    <a href="../index.html" class="secondary-btn">Back Home</a>
  </header>

  <main class="login-page">

    <section class="login-card">
      <p class="eyebrow">Client Portal</p>

      <h1>Welcome back.</h1>

      <p class="login-subtext">
        Log in to view missed-call leads, follow-up status, and customer activity.
      </p>

      <form class="login-form" id="login-form">
  <label>Email Address</label>
  <input id="login-email" type="email" placeholder="client@email.com" required />

  <label>Password</label>
  <input id="login-password" type="password" placeholder="••••••••" required />

  <button type="submit">Login to Dashboard</button>
</form>

      <p class="login-help">
        Need access? Contact NorthX Systems to activate your client portal.
      </p>
    </section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
